<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradus — Temperature Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #eae4d6;
      --panel: #f4efe4;
      --ink: #22291f;
      --ink-soft: #59604f;
      --line: #c7bea7;
      --brass: #9c6f2d;
      --mercury: #b6392b;
      --mercury-cold: #2f5b63;
      --err: #9c2b1f;
      --err-bg: #f2ddd7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 15% 10%, rgba(156, 111, 45, 0.08), transparent 45%),
                  radial-gradient(circle at 85% 90%, rgba(47, 91, 99, 0.08), transparent 45%),
                  var(--paper);
      font-family: "Source Serif 4", Georgia, serif;
      color: var(--ink);
      padding: 32px 18px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 18px 40px -24px rgba(34, 41, 31, 0.45);
      padding: 36px 38px 30px;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(156, 111, 45, 0.25);
      border-radius: 2px;
      pointer-events: none;
    }

    .eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 8px;
    }

    h1 {
      font-family: "Fraunces", serif;
      font-size: 28px;
      margin: 0 0 20px 0;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid var(--line);
      border-radius: 4px;
      margin-bottom: 12px;
    }

    button {
      background: var(--brass);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      font-family: "IBM Plex Mono", monospace;
      font-size: 18px;
      margin-top: 15px;
      color: var(--ink);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="eyebrow">Instrument No. 01</div>
    <h1>Temperature Converter</h1>

    <div class="input-group">
      <label for="tempInput">Degrees</label>
      <input type="number" id="tempInput" placeholder="Enter temperature" step="any">

      <label for="unitSelect">Convert From</label>
      <select id="unitSelect">
        <option value="C">Celsius (°C)</option>
        <option value="F">Fahrenheit (°F)</option>
        <option value="K">Kelvin (K)</option>
      </select>

      <button onclick="convertTemp()">Convert</button>
    </div>

    <div class="result" id="resultDisplay">Result will appear here...</div>
  </div>

  <script>
    function convertTemp() {
      const val = parseFloat(document.getElementById('tempInput').value);
      const unit = document.getElementById('unitSelect').value;
      const res = document.getElementById('resultDisplay');

      if (isNaN(val)) {
        res.textContent = "Please enter a valid number.";
        return;
      }

      let c, f, k;

      if (unit === "C") {
        c = val;
        f = (val * 9/5) + 32;
        k = val + 273.15;
      } else if (unit === "F") {
        f = val;
        c = (val - 32) * 5/9;
        k = c + 273.15;
      } else if (unit === "K") {
        k = val;
        c = val - 273.15;
        f = (c * 9/5) + 32;
      }

      res.innerHTML = `
        ${c.toFixed(2)} °C &nbsp;|&nbsp; 
        ${f.toFixed(2)} °F &nbsp;|&nbsp; 
        ${k.toFixed(2)} K
      `;
    }
  </script>
</body>
</html>
